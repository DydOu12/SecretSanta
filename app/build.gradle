plugins {
    id "org.sonarqube" version "6.0.1.5171"
    id 'jacoco'
}

jacoco {
    toolVersion = "0.8.14" // utilisez la version compatible avec votre JDK
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'  // Utilisez la tâche de test de debug

    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file("reports/jacoco/jacoco.xml")
        html.required = true
        html.outputLocation = layout.buildDirectory.dir("reports/jacoco/html")
    }

    def fileFilter = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*']

    // Pour les projets Android, utilisez ces chemins
    def debugTree = fileTree(dir: layout.buildDirectory.dir("intermediates/javac/debug").get().asFile, excludes: fileFilter)
    // Si le chemin ci-dessus ne fonctionne pas, essayez celui-ci pour les projets plus anciens :
    // def debugTree = fileTree(dir: "${buildDir}/intermediates/classes/debug", excludes: fileFilter)

    sourceDirectories.from = files('src/main/java')
    classDirectories.from = files([debugTree])

    // Recherchez les fichiers d'exécution dans différents emplacements possibles
    executionData.setFrom(fileTree(dir: layout.buildDirectory.get().asFile, includes: [
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
            'jacoco/testDebugUnitTest.exec',
            '**/*.exec'
    ]))
}

apply plugin: 'com.android.application'

android {

    compileSdk 35

    defaultConfig {
        applicationId "com.example.dylan.randomnoel"
        minSdkVersion 28
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
        debug {
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    namespace 'com.example.dylan.randomnoel'

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'robolectric.sdk.version', 30
                systemProperty 'robolectric.logging', 'stdout'

                // Activer les logs détaillés
                jvmArgs '-Drobolectric.logging=stdout'

                // Configuration supplémentaire pour les ressources
                systemProperty 'android.manifest', 'app/src/main/AndroidManifest.xml'
                systemProperty 'android.resources', 'src/main/res'

                jacoco {
                    includeNoLocationClasses = false
                    excludes = ['jdk.internal.*', 'android.*', 'androidx.*']
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation files('libs/activation.jar')
    implementation files('libs/additionnal.jar')
    implementation files('libs/mail.jar')

    //noinspection GradleCompatible
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.20.0' //Mockito
    testImplementation 'org.mockito:mockito-inline:5.2.0' // Pour mock les class final
    testImplementation 'org.jacoco:org.jacoco.core:0.8.14'

    // Pour l'utilisation de lombok
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
}
